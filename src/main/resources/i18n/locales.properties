# Supported display locales for the Risk UI.
#
# This file is the single source of truth for which languages the UI offers.
# To add a new language:
#   1. Create labels_<lang>.properties next to this file (translated copy of labels.properties).
#   2. Append the new language tag to the comma-separated list below.
#   3. Make sure the new bundle defines a "locale.displayName" key.
# No Java code changes are required.
#
# Use IETF BCP 47 language tags (e.g., en, es, fr, de, ko, ja).
# The first entry is the default locale.
locales = en,es
